[workspace]
resolver = "2"
members = ["crates/quaderno-core", "crates/quaderno4linux", "crates/quaderno-mock"]

[workspace.package]
version = "0.1.1"
edition = "2021"
repository = "https://github.com/YutoMaeda1209/quaderno4linux"
license = "MIT"

[workspace.dependencies]
quaderno-core = { path = "crates/quaderno-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
strip = true

[profile.dev.package."*"]
opt-level = 2

