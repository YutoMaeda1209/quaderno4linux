[workspace]
resolver = "2"
members = ["crates/quaderno-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/YutoMaeda1209/quaderno4linux"

[workspace.dependencies]
quaderno-core = { path = "crates/quaderno-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

