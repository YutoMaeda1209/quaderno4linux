name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml (v$version)"
            exit 1
          fi
      # Image names on ghcr.io must be lowercase.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          cacheFrom: ${{ env.IMAGE }}
          push: never
          env: |
            CARGO_TERM_COLOR
            CARGO_BUILD_WARNINGS
          runCmd: |
            set -e
            cargo test --workspace
            cargo build --release -p quaderno4linux
            cargo deb -p quaderno4linux --no-build
            cargo generate-rpm -p crates/quaderno4linux
      - name: Write checksums
        run: sha256sum target/debian/*.deb target/generate-rpm/*.rpm | sed 's|  .*/|  |' > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
