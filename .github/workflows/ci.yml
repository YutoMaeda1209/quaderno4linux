name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  # Fail on any warning, including Cargo's manifest lints that `-D warnings` does not cover.
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Image names on ghcr.io must be lowercase.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/devcontainer" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          cacheFrom: ${{ env.IMAGE }}
          # Refresh the cached image only from main.
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          env: |
            CARGO_TERM_COLOR
            CARGO_BUILD_WARNINGS
          runCmd: |
            set -e
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
