name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ubuntu:
    name: Ubuntu (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang cmake libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  fedora:
    name: Fedora (build, test)
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install system libraries
        run: |
          dnf install -y gcc gcc-c++ clang cmake git pkgconf-pkg-config \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel libxcb-devel \
            vulkan-loader-devel fontconfig-devel freetype-devel openssl-devel libzstd-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
