# cargo-about の設定。リリースで依存クレートのライセンス一覧
# (THIRD_PARTY_LICENSES.html) を生成するのに使う。

# 複数のライセンスから選べるクレート (`MIT OR Apache-2.0` など) では、先に書いたものが選ばれる。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
]
# リリースするのは x86_64 の Linux 版だけなので、ほかのプラットフォーム専用の依存は含めない。
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
# このリポジトリのクレート (`publish = false`) は一覧に含めない。
private = { ignore = true }
