[package]
name = "quaderno4linux"
description = "Desktop manager for Fujitsu Quaderno on Linux"
version.workspace = true
edition.workspace = true

[dependencies]
quaderno-core.workspace = true
anyhow.workspace = true
log.workspace = true
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
env_logger = "0.11"
# gpui 0.2.2 depends (via zed-async-tar) on xattr 0.2.3, which uses `libc::ENOATTR`.
# That constant was removed for Linux in libc 0.2.190, so pin libc until gpui
# moves to a newer xattr. Not used directly by this crate.
libc = "=0.2.188"
