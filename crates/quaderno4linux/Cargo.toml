[package]
name = "quaderno4linux"
description = "Desktop manager for Fujitsu Quaderno on Linux"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
quaderno-core.workspace = true
anyhow.workspace = true
log.workspace = true
gpui-kit = "0.11.0"
env_logger = "0.11"
dirs = "6"
# Not used directly. Debug builds of rust-embed read the icons from the source
# directory at run time, which does not exist when a binary built in the dev
# container runs on the host; `debug-embed` embeds them as in release builds.
rust-embed = { version = "8", features = ["debug-embed"] }
