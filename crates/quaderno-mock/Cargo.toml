[package]
name = "quaderno-mock"
description = "A simulated Quaderno device for development and tests (no hardware required)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
quaderno-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger = "0.11"
tiny_http = { version = "0.12", features = ["ssl-openssl"] }
rcgen = "0.13"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
